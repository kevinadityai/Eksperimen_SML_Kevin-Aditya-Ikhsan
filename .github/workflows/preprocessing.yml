name: Preprocessing Pipeline

on:
  push:
    branches: [main]
    paths:
      - "bankmarketing_raw/**"
      - "preprocessing/automate_*.py"
      - ".github/workflows/preprocessing.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preprocess:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run preprocessing
        run: |
          python preprocessing/automate_Kevin-Aditya-Ikhsan.py \
            --input bankmarketing_raw/bank-additional-full.csv \
            --output preprocessing/bankmarketing_preprocessing

      - name: Upload processed dataset
        uses: actions/upload-artifact@v4
        with:
          name: bankmarketing_preprocessing
          path: preprocessing/bankmarketing_preprocessing/

      - name: Commit processed dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preprocessing/bankmarketing_preprocessing
          git diff --staged --quiet || git commit -m "ci: update processed dataset [skip ci]"
          git push
